name: brandpulse

x-common: &common
  restart: unless-stopped
  networks: [brandpulse]

services:
  # -------------------------------------------------------------------
  # Kafka en modo KRaft (sin ZooKeeper)
  # -------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    <<: *common
    container_name: bp-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx400m -Xms200m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # -------------------------------------------------------------------
  # Crea el topic explicitamente antes de que nadie lo consuma.
  # Evita la carrera del auto-create (metadata con particiones que cambian)
  # que hacia fallar al Kafka source de Spark con UnknownTopicOrPartition.
  # -------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.9.0
    <<: *common
    container_name: bp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic "$${KAFKA_TOPIC}"
        --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --describe --topic "$${KAFKA_TOPIC}"
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC}

  # -------------------------------------------------------------------
  # Postgres: warehouse de sentimiento
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    <<: *common
    container_name: bp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # -------------------------------------------------------------------
  # Productor: API sintetica -> topic Kafka
  # -------------------------------------------------------------------
  producer:
    build:
      context: ./producer
    <<: *common
    container_name: bp-producer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      BRAND: ${BRAND}
      PRODUCER_RATE: ${PRODUCER_RATE}
      PLATFORMS: ${PLATFORMS}

  # -------------------------------------------------------------------
  # Spark: master y worker
  # -------------------------------------------------------------------
  spark-master:
    build:
      context: ./spark
    image: brandpulse-spark
    <<: *common
    container_name: bp-spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    environment:
      SPARK_DAEMON_MEMORY: 512m
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  spark-worker:
    build:
      context: ./spark
    image: brandpulse-spark
    <<: *common
    container_name: bp-spark-worker
    hostname: spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --cores 2 --memory 900m spark-master:7077
    environment:
      SPARK_DAEMON_MEMORY: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # -------------------------------------------------------------------
  # Consumidor: Spark Structured Streaming
  # -------------------------------------------------------------------
  spark-job:
    build:
      context: ./spark
    image: brandpulse-spark
    <<: *common
    container_name: bp-spark-job
    hostname: spark-job
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    environment:
      PYSPARK_PYTHON: /opt/venv/bin/python
      PYSPARK_DRIVER_PYTHON: /opt/venv/bin/python
      SPARK_MASTER_URL: spark://spark-master:7077
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      BRAND: ${BRAND}
      SPARK_TRIGGER: ${SPARK_TRIGGER}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GRAPH_LIMIT: "120"
      CHECKPOINT_DIR: /opt/app/checkpoint
    command: >
      bash -c "sleep 10 && /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --conf spark.executor.memory=512m
      --conf spark.executor.cores=1
      --conf spark.driver.memory=768m
      --conf spark.sql.shuffle.partitions=4
      --conf spark.sql.streaming.schemaInference=false
      /opt/app/jobs/sentiment_stream.py"
    ports:
      - "4040:4040"

  # -------------------------------------------------------------------
  # API REST que alimenta al dashboard
  # -------------------------------------------------------------------
  api:
    build:
      context: ./api
    <<: *common
    container_name: bp-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BRAND: ${BRAND}
    ports:
      - "${API_PORT}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------
  # Dashboard React (nginx sirve el build y hace proxy a /api)
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    <<: *common
    container_name: bp-frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:80"

volumes:
  kafka-data:
  pg-data:

networks:
  brandpulse:
    driver: bridge